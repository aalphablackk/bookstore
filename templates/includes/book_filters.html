<div class="booknest-filter-card">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            {% comment %} <span class="booknest-section-label d-block mb-1">
                Refine
            </span> {% endcomment %}

            <h5 class="fw-bold mb-0">
                Filter Books
            </h5>
        </div>

        <a
            href="{% url 'books:book_list' %}"
            class="small text-decoration-none text-muted"
        >
            Clear
        </a>

    </div>


    <!-- Category -->
    <div class="booknest-filter-group">

        <h6 class="booknest-filter-heading">
            Category
        </h6>

        <div class="booknest-filter-options">

            <label class="booknest-filter-option">

                <input
                    type="radio"
                    name="category"
                    value=""
                    {% if not selected_category %}checked{% endif %}
                >

                <span>
                    All categories
                </span>

            </label>


            {% for category in categories %}

                <label class="booknest-filter-option">

                    <input
                        type="radio"
                        name="category"
                        value="{{ category.slug }}"
                        {% if selected_category == category.slug %}
                            checked
                        {% endif %}
                    >

                    <span>
                        {{ category.name }}
                    </span>

                </label>

            {% endfor %}

        </div>

    </div>


    <!-- Format -->
    <div class="booknest-filter-group">

        <h6 class="booknest-filter-heading">
            Format
        </h6>

        <div class="booknest-filter-options">

            <label class="booknest-filter-option">

                <input
                    type="radio"
                    name="format"
                    value=""
                    {% if not selected_format %}checked{% endif %}
                >

                <span>
                    All formats
                </span>

            </label>


            <label class="booknest-filter-option">

                <input
                    type="radio"
                    name="format"
                    value="physical"
                    {% if selected_format == "PHYSICAL" %}
                        checked
                    {% endif %}
                >

                <span>
                    Physical
                </span>

            </label>


            <label class="booknest-filter-option">

                <input
                    type="radio"
                    name="format"
                    value="digital"
                    {% if selected_format == "DIGITAL" %}
                        checked
                    {% endif %}
                >

                <span>
                    Digital
                </span>

            </label>

        </div>

    </div>


    <button
        type="submit"
        class="btn btn-booknest w-100"
    >
        <i class="bi bi-funnel me-2"></i>
        Apply Filters
    </button>

</div>
